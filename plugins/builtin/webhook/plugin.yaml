name: webhook
version: "0.1.0"
display_name: "Webhook"
description: "Generic HTTP webhook plugin — send JSON payloads to any URL with HMAC signing and auth support."
category: notification
type: builtin
author: PEPA Team
license: Apache-2.0

config_schema:
  type: object
  properties:
    webhook_url:
      type: string
      description: "Default target URL for webhook requests"
    bearer_token:
      type: string
      description: "Bearer token for Authorization header"
    hmac_secret:
      type: string
      description: "Shared secret for HMAC-SHA256 signature (X-PEPA-Signature header)"
    api_key:
      type: string
      description: "API key sent in a configurable header"
    api_key_header:
      type: string
      description: "Header name for the API key (default: X-API-Key)"
  required:
    - webhook_url

actions:
  - name: send_webhook
    description: "Send a JSON payload to a webhook URL with optional auth and HMAC signing"

health_check:
  endpoint: /health
  interval: 60s
