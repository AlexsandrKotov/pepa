name: telegram
version: "0.1.0"
display_name: "Telegram"
description: "Notification plugin for Telegram — send messages to chats and groups."
category: notification
type: builtin
author: PEPA Team
license: Apache-2.0

config_schema:
  type: object
  properties:
    bot_token:
      type: string
      description: "Telegram Bot API token (from @BotFather)"
    chat_id:
      type: string
      description: "Default chat/group ID for notifications"
  required:
    - bot_token
    - chat_id

actions:
  - name: send_message
    description: "Send a text message to a Telegram chat"
  - name: get_updates
    description: "Retrieve recent bot updates (diagnostics)"

health_check:
  endpoint: /health
  interval: 60s
