name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:

jobs:
  # ── Backend (Go) ────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
        continue-on-error: true

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  # ── Docker Build ────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        target: [api-server, worker, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target == 'frontend' && './frontend' || '.' }}
          file: ${{ matrix.target == 'api-server' && './deployments/docker/Dockerfile.api' || matrix.target == 'worker' && './deployments/docker/Dockerfile.worker' || './deployments/docker/Dockerfile.frontend' }}
          push: false
          tags: pepa/${{ matrix.target }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Helm Lint ───────────────────────────────────────────────
  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deployments/helm/pepa

      - name: Template chart
        run: helm template test deployments/helm/pepa

  # ── Plugin Build & Sign ─────────────────────────────────────
  plugins:
    name: Build & Sign Plugins
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Build all plugins
        run: make plugins

      - name: Write signing key from secret
        if: env.PEPA_SIGNING_KEY != ''
        env:
          PEPA_SIGNING_KEY: ${{ secrets.PEPA_PLUGINS_PRIVATE_KEY }}
        run: |
          echo "$PEPA_SIGNING_KEY" > pepa-plugins-private.pem

      - name: Sign plugins
        if: env.PEPA_SIGNING_KEY != ''
        env:
          PEPA_SIGNING_KEY: ${{ secrets.PEPA_PLUGINS_PRIVATE_KEY }}
        run: |
          echo "$PEPA_SIGNING_KEY" > pepa-plugins-private.pem
          make sign-plugins
          rm -f pepa-plugins-private.pem

      - name: Verify plugin signatures
        run: make verify-plugins

      - name: Upload signed plugins
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: signed-plugins
          path: |
            plugins/bin/*/
            plugins/builtin/*/plugin.yaml
            plugins/builtin/*/plugin.yaml.checksum
            plugins/builtin/*/plugin.yaml.sig
          retention-days: 30
