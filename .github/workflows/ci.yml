name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend (Go) ────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=20
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::warning::Test coverage ${COVERAGE}% is below ${THRESHOLD}% target"
          fi

      - name: Security scan (gosec)
        uses: securego/gosec@master
        with:
          args: '-exclude-generated -exclude=G101,G106,G115,G122,G204,G304,G402,G703 ./...'

      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
        continue-on-error: true

  # ── API Contract Check ──────────────────────────────────────
  api-contract:
    name: API Contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check OpenAPI coverage
        run: ./scripts/openapi-diff/main.sh

      - name: Validate OpenAPI spec with Spectral
        if: always()
        uses: stoplightio/spectral-action@latest
        with:
          spec-file: docs/openapi.yaml
        continue-on-error: true

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Docker Build ────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        target: [api-server, worker, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Load tool versions
        run: grep -v '^#' .env.versions | grep -v '^$' >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.target == 'frontend' && './frontend' || '.' }}
          file: ${{ matrix.target == 'api-server' && './deployments/docker/Dockerfile.api' || matrix.target == 'worker' && './deployments/docker/Dockerfile.worker' || './deployments/docker/Dockerfile.frontend' }}
          push: false
          tags: pepa/${{ matrix.target }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HELM_VERSION=${{ env.HELM_VERSION }}
            OPENTOFU_VERSION=${{ env.OPENTOFU_VERSION }}
            TRIVY_VERSION=${{ env.TRIVY_VERSION }}

  # ── Helm Lint ───────────────────────────────────────────────
  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint deployments/helm/pepa

      - name: Template chart
        run: helm template test deployments/helm/pepa

  # ── Plugin Build & Sign ─────────────────────────────────────
  plugins:
    name: Build & Sign Plugins
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      HAS_SIGNING_KEY: ${{ secrets.PEPA_PLUGINS_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Build all plugins
        run: make plugins

      - name: Write signing key from secret
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          PEPA_SIGNING_KEY: ${{ secrets.PEPA_PLUGINS_PRIVATE_KEY }}
        run: |
          PEPA_KEY_FILE="$(mktemp)"
          chmod 600 "$PEPA_KEY_FILE"
          echo "$PEPA_SIGNING_KEY" > "$PEPA_KEY_FILE"
          echo "PEPA_KEY_FILE=$PEPA_KEY_FILE" >> "$GITHUB_ENV"

      - name: Sign plugins
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          PEPA_PLUGINS_PRIVATE_KEY: ${{ env.PEPA_KEY_FILE }}
        run: make sign-plugins

      - name: Verify plugin signatures
        if: env.HAS_SIGNING_KEY == 'true'
        run: make verify-plugins

      - name: Cleanup signing key
        if: always() && env.HAS_SIGNING_KEY == 'true' && env.PEPA_KEY_FILE
        run: rm -f "$PEPA_KEY_FILE"

      - name: Upload signed plugins
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: signed-plugins
          path: |
            plugins/bin/
            plugins/builtin/*/plugin.yaml
            plugins/builtin/*/plugin.yaml.checksum
            plugins/builtin/*/plugin.yaml.checksum.sig
          retention-days: 30

  # ── E2E Tests (Playwright) ──────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        run: npm run dev &
        env:
          PORT: 3000

      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
