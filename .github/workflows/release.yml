            echo "tar xzf pepa-plugins-${RELEASE_TAG#v}-linux-<arch>.tar.gz"
            echo ""
            echo "# Copy plugin binaries"
            echo "cp -r pepa-plugins-${RELEASE_TAG#v}-linux-<arch>/bin/* \\"
            echo "  pepa-production-${RELEASE_TAG#v}/plugins/bin/"
            echo '```'
            echo ""
            echo "### 3. Deploy"
            echo ""
            echo '```bash'
            echo "cd pepa-production-${RELEASE_TAG#v}"
