name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -- 1. Full Test Suite --
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Backend - build
        run: go build -v ./...

      - name: Backend - install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Backend - lint
        run: $(go env GOPATH)/bin/golangci-lint run

      - name: Backend - test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Backend - security scan
        uses: securego/gosec@master
        with:
          args: '-exclude-generated -exclude=G101,G115,G122,G204,G304,G402,G703 ./...'

      - name: Backend - vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Frontend - install
        run: cd frontend && npm ci

      - name: Frontend - build
        run: cd frontend && npm run build

      - name: Frontend - audit
        run: cd frontend && npm audit --audit-level=high
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
        continue-on-error: true

  # -- 2. Build & Push Docker Images --
  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        include:
          - target: api-server
            dockerfile: deployments/docker/Dockerfile.api
            context: .
          - target: worker
            dockerfile: deployments/docker/Dockerfile.worker
            context: .
          - target: frontend
            dockerfile: deployments/docker/Dockerfile.frontend
            context: frontend/
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}/pepa-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=PEPA ${{ matrix.target }}
            org.opencontainers.image.description=PEPA Platform Engineering & Pipeline Automator
            org.opencontainers.image.vendor=PEPA

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Scan image for vulnerabilities
        env:
          TRIVY_IMAGE_TAG: ${{ github.ref_name }}
        run: |
          # Strip 'v' prefix from tag (images are tagged as '0.1.0' not 'v0.1.0')
          TRIVY_IMAGE_TAG="${TRIVY_IMAGE_TAG#v}"
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ github.event.repository.name }}/pepa-${{ matrix.target }}:${TRIVY_IMAGE_TAG}"
          echo "Scanning ${IMAGE_REF}"
          trivy image --format sarif --output "trivy-${{ matrix.target }}.sarif" --severity CRITICAL,HIGH "${IMAGE_REF}" || true

      - name: Check Trivy output
        id: trivy-check
        run: |
          if [ -f "trivy-${{ matrix.target }}.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Trivy SARIF file not found, skipping upload"
          fi

      - name: Upload Trivy results
        if: steps.trivy-check.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-${{ matrix.target }}.sarif'
        continue-on-error: true

  # -- 3. Build & Sign Plugins --
  plugins:
    name: Build & Sign Plugins
    runs-on: ubuntu-latest
    needs: [test]
    env:
      HAS_SIGNING_KEY: ${{ secrets.PEPA_PLUGINS_PRIVATE_KEY != '' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Build plugins
        run: make plugins PLUGIN_GOARCH=${{ matrix.arch }}

      - name: Write signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          PEPA_SIGNING_KEY: ${{ secrets.PEPA_PLUGINS_PRIVATE_KEY }}
        run: echo "$PEPA_SIGNING_KEY" > pepa-plugins-private.pem

      - name: Sign plugins
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          make sign-plugins
          rm -f pepa-plugins-private.pem

      - name: Verify plugin signatures
        if: env.HAS_SIGNING_KEY == 'true'
        run: make verify-plugins

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v5
        with:
          name: plugins-linux-${{ matrix.arch }}
          path: |
            plugins/bin/
          retention-days: 7

      - name: Upload plugin manifests
        uses: actions/upload-artifact@v5
        with:
          name: plugins-manifests
          path: |
            plugins/builtin/
          retention-days: 7

  # -- 3b. Push Plugins Image to GHCR --
  plugins-image:
    name: Plugins Image
    runs-on: ubuntu-latest
    needs: [plugins]
    steps:
      - uses: actions/checkout@v5

      - name: Download amd64 plugins
        uses: actions/download-artifact@v5
        with:
          name: plugins-linux-amd64
          path: staging/amd64

      - name: Download arm64 plugins
        uses: actions/download-artifact@v5
        with:
          name: plugins-linux-arm64
          path: staging/arm64

      - name: Download plugin manifests
        uses: actions/download-artifact@v5
        with:
          name: plugins-manifests
          path: staging/manifests

      - name: Stage per-arch directories
        run: |
          echo "=== Debug: staging structure ==="
          find staging/ -type f | head -50
          echo "================================"
          for arch in amd64 arm64; do
            mkdir -p "plugins/bin-${arch}/builtin" "plugins/bin-${arch}/community"
            if [ -d "staging/${arch}/builtin" ]; then
              cp -r "staging/${arch}/builtin/"* "plugins/bin-${arch}/builtin/" 2>/dev/null || true
            fi
            if [ -d "staging/${arch}/community" ]; then
              cp -r "staging/${arch}/community/"* "plugins/bin-${arch}/community/" 2>/dev/null || true
            fi
          done
          # Copy manifests (shared across architectures, from separate artifact)
          cp -r staging/manifests/* plugins/builtin/ 2>/dev/null || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}/pepa-plugins
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.plugins
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -- 3c. Package Plugin Archives --
  plugins-packaging:
    name: Plugin Archives
    runs-on: ubuntu-latest
    needs: [plugins]
    steps:
      - name: Download amd64 plugins
        uses: actions/download-artifact@v5
        with:
          name: plugins-linux-amd64
          path: staging/amd64

      - name: Download arm64 plugins
        uses: actions/download-artifact@v5
        with:
          name: plugins-linux-arm64
          path: staging/arm64

      - name: Download plugin manifests
        uses: actions/download-artifact@v5
        with:
          name: plugins-manifests
          path: staging/manifests

      - name: Create per-arch tarballs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "=== Debug: staging structure ==="
          find staging/ -type f | head -50
          echo "================================"
          for arch in amd64 arm64; do
            PKG="pepa-plugins-${VERSION}-linux-${arch}"
            mkdir -p "${PKG}/bin" "${PKG}/builtin"
            # Copy all plugin binaries directly to bin/ (no subdirectories)
            if [ -d "staging/${arch}/builtin" ]; then
              cp -r "staging/${arch}/builtin/"* "${PKG}/bin/" 2>/dev/null || true
            fi
            if [ -d "staging/${arch}/community" ]; then
              cp -r "staging/${arch}/community/"* "${PKG}/bin/" 2>/dev/null || true
            fi
            # Copy manifests (shared, from separate manifests artifact)
            if [ -d "staging/manifests" ]; then
              cp -r staging/manifests/* "${PKG}/builtin/" 2>/dev/null || true
            fi
            tar czf "${PKG}.tar.gz" "${PKG}"
            echo "Built ${PKG}.tar.gz"
            echo "Contents:"
            tar tzf "${PKG}.tar.gz" | head -30
          done
          ls -lh pepa-plugins-*.tar.gz

      - name: Upload amd64 archive
        uses: actions/upload-artifact@v5
        with:
          name: plugins-archive-amd64
          path: pepa-plugins-*-linux-amd64.tar.gz
          retention-days: 7

      - name: Upload arm64 archive
        uses: actions/upload-artifact@v5
        with:
          name: plugins-archive-arm64
          path: pepa-plugins-*-linux-arm64.tar.gz
          retention-days: 7

  # -- 4. Generate Checksums --
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [plugins-packaging, production-archive]
    steps:
      - name: Download production archive
        uses: actions/download-artifact@v5
        with:
          name: production-archive
          path: artifacts/production/

      - name: Download plugin archives
        uses: actions/download-artifact@v5
        with:
          pattern: plugins-archive-*
          path: artifacts/plugins/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          find artifacts/ -type f -name '*.tar.gz' | sort | while read -r f; do
            sha256sum "$f" >> sha256sums.txt
          done
          cat sha256sums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: checksums
          path: sha256sums.txt
          retention-days: 30

  # -- 5b. Production Archive --
  production-archive:
    name: Production Archive
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v5

      - name: Build production package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PKG="pepa-production-${VERSION}"
          mkdir -p "${PKG}/nginx/ssl" "${PKG}/plugins/bin"

          # Copy supporting files
          cp deployments/compose/init-db.sql "${PKG}/init-db.sql"

          # Generate secrets
          JWT_SECRET="$(openssl rand -hex 32)"
          ENCRYPTION_KEY="$(openssl rand -hex 32)"
          POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          REDIS_PASSWORD="$(openssl rand -hex 16)"

          # Generate .env
          cat << ENVEOF | sed 's/^          //' > "${PKG}/.env"
          # PEPA Production Environment — ${RELEASE_TAG}
          SERVER_ENV=production
          POSTGRES_DB=pepa
          POSTGRES_USER=pepa
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_PORT=5432
          REDIS_PASSWORD=${REDIS_PASSWORD}
          REDIS_PORT=6379
          AUTH_JWT_SECRET=${JWT_SECRET}
          ENCRYPTION_KEY=${ENCRYPTION_KEY}
          API_PORT=8088
          FRONTEND_PORT=3000
          CORS_ORIGINS=https://localhost,https://127.0.0.1
          VAULT_ALLOW_PRIVATE_IPS=false
          MOUNT_DOCK_SOCKET=/dev/null
          ENVEOF

          # Generate self-signed SSL cert
          openssl req -x509 -nodes -days 365 \
            -newkey rsa:2048 \
            -keyout "${PKG}/nginx/ssl/key.pem" \
            -out "${PKG}/nginx/ssl/cert.pem" \
            -subj "/C=US/ST=State/L=City/O=PEPA/CN=localhost" 2>/dev/null

          echo "Package built"

      - name: Generate production docker-compose and nginx
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PKG="pepa-production-${VERSION}"
          GHCR="ghcr.io/${REPO,,}"

          # Generate a self-contained docker-compose.yml with hardcoded image refs
          cat > "${PKG}/docker-compose.yml" << COMPEOF
          name: pepa
          networks:
            pepa-net:
              driver: bridge
          volumes:
            postgres-data:
              driver: local
            redis-data:
              driver: local
            custom-plugins:
              driver: local
            nginx-logs:
              driver: local
          x-common-env: &common-env
            POSTGRES_HOST: postgres
            POSTGRES_PORT: "5432"
            POSTGRES_DB: pepa
            POSTGRES_USER: pepa
            POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
            POSTGRES_SSLMODE: disable
            REDIS_HOST: redis
            REDIS_PORT: "6379"
            REDIS_PASSWORD: \${REDIS_PASSWORD}
            ENCRYPTION_KEY: \${ENCRYPTION_KEY}
            AUTH_JWT_SECRET: \${AUTH_JWT_SECRET}
            PLUGIN_DIR: /plugins
            VAULT_ALLOW_PRIVATE_IPS: false
          services:
            postgres:
              image: pgvector/pgvector:pg18
              container_name: pepa-postgres
              restart: unless-stopped
              environment:
                POSTGRES_DB: pepa
                POSTGRES_USER: pepa
                POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
                PGDATA: /var/lib/postgresql/data/pgdata
              ports:
                - "127.0.0.1:\${POSTGRES_PORT:-5432}:5432"
              volumes:
                - postgres-data:/var/lib/postgresql/data
                - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
              networks:
                - pepa-net
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U pepa -d pepa"]
                interval: 5s
                timeout: 3s
                retries: 10
                start_period: 10s
            redis:
              image: redis:7.4-alpine
              container_name: pepa-redis
              restart: unless-stopped
              command: >
                redis-server
                --requirepass \${REDIS_PASSWORD}
                --maxmemory 200mb
                --maxmemory-policy allkeys-lru
                --appendonly yes
              ports:
                - "127.0.0.1:\${REDIS_PORT:-6379}:6379"
              volumes:
                - redis-data:/data
              networks:
                - pepa-net
              healthcheck:
                test: ["CMD", "redis-cli", "-a", "\${REDIS_PASSWORD}", "ping"]
                interval: 5s
                timeout: 3s
                retries: 10
            api-server:
              image: ${GHCR}/pepa-api-server:${VERSION}
              container_name: pepa-api
              restart: unless-stopped
              environment:
                <<: *common-env
                SERVER_PORT: "8080"
                SERVER_HOST: "0.0.0.0"
                SERVER_ENV: production
                LOG_LEVEL: info
                CUSTOM_PLUGIN_DIR: /custom-plugins
                CORS_ORIGINS: \${CORS_ORIGINS:-https://localhost}
              ports:
                - "\${API_PORT:-8088}:8080"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 30s
              volumes:
                - ./plugins:/plugins:ro
                - custom-plugins:/custom-plugins
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              networks:
                - pepa-net
            worker:
              image: ${GHCR}/pepa-worker:${VERSION}
              container_name: pepa-worker
              restart: unless-stopped
              environment:
                <<: *common-env
                CUSTOM_PLUGIN_DIR: /custom-plugins
                SERVER_ENV: production
                LOG_LEVEL: info
              volumes:
                - ./plugins:/plugins:ro
                - custom-plugins:/custom-plugins
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              networks:
                - pepa-net
            frontend:
              image: ${GHCR}/pepa-frontend:${VERSION}
              container_name: pepa-frontend
              restart: unless-stopped
              ports:
                - "\${FRONTEND_PORT:-3000}:3000"
              depends_on:
                - api-server
              networks:
                - pepa-net
            nginx:
              image: nginx:1.31-alpine
              container_name: pepa-nginx
              restart: unless-stopped
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                - ./nginx/ssl:/etc/nginx/ssl:ro
                - nginx-logs:/var/log/nginx
              depends_on:
                api-server:
                  condition: service_started
                frontend:
                  condition: service_started
              networks:
                - pepa-net
          COMPEOF
          sed -i 's/^          //' "${PKG}/docker-compose.yml"

          # Copy nginx config from the repo
          cp deployments/compose/nginx.conf "${PKG}/nginx/nginx.conf"

      - name: Create deploy.sh and stop.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PKG="pepa-production-${VERSION}"

          cat > "${PKG}/deploy.sh" << 'DEPLOY_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"
          log()  { echo -e "\033[0;34m[PEPA]\033[0m $*"; }
          ok()   { echo -e "\033[0;32m[OK]\033[0m $*"; }
          warn() { echo -e "\033[1;33m[WARN]\033[0m $*"; }
          err()  { echo -e "\033[0;31m[ERROR]\033[0m $*"; }
          echo ""
          echo -e "\033[0;34m  PEPA — Production Deployment\033[0m"
          echo ""
          if ! command -v docker &> /dev/null; then err "Docker is not installed."; exit 1; fi
          if ! docker info &> /dev/null; then err "Docker daemon is not running."; exit 1; fi
          if docker compose version &> /dev/null; then COMPOSE_CMD="docker compose"; elif command -v docker-compose &> /dev/null; then COMPOSE_CMD="docker-compose"; else err "Docker Compose not available."; exit 1; fi
          ok "Docker & Compose detected ($COMPOSE_CMD)"
          if [ ! -f .env ]; then warn ".env not found."; exit 1; fi
          ok ".env found"
          log "Stopping any existing PEPA stack..."
          $COMPOSE_CMD down --remove-orphans 2>/dev/null || true
          FRESH=false
          for arg in "$@"; do case $arg in --fresh) FRESH=true ;; esac; done
          if $FRESH; then
            warn "--fresh flag set: removing all data volumes!"
            $COMPOSE_CMD down -v --remove-orphans 2>/dev/null || true
          fi
          log "Pulling Docker images from GHCR..."
          $COMPOSE_CMD pull
          ok "Images pulled"
          log "Starting PEPA services..."
          $COMPOSE_CMD up -d
          log "Waiting for services..."
          MAX_RETRIES=60; RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            if curl -sf http://localhost:${API_PORT:-8088}/healthz > /dev/null 2>&1; then break; fi
            RETRY=$((RETRY + 1)); sleep 2
          done
          if [ $RETRY -eq $MAX_RETRIES ]; then
            warn "API not ready. Check: $COMPOSE_CMD logs api-server"
          else
            ok "PEPA is up and running!"
          fi
          echo ""
          echo "  Frontend:   https://localhost"
          echo "  API:        http://localhost:${API_PORT:-8088}"
          echo ""
          DEPLOY_EOF
          sed -i 's/^          //' "${PKG}/deploy.sh"
          chmod +x "${PKG}/deploy.sh"

          cat > "${PKG}/stop.sh" << 'STOP_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"
          if docker compose version &> /dev/null; then COMPOSE_CMD="docker compose"; else COMPOSE_CMD="docker-compose"; fi
          echo "Stopping PEPA..."
          $COMPOSE_CMD down
          echo "PEPA stopped."
          STOP_EOF
          sed -i 's/^          //' "${PKG}/stop.sh"
          chmod +x "${PKG}/stop.sh"

      - name: Create tarball
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PKG="pepa-production-${VERSION}"
          tar czf "${PKG}.tar.gz" "${PKG}"
          ls -lh "${PKG}.tar.gz"
          echo "ARCHIVE=${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload production archive
        uses: actions/upload-artifact@v5
        with:
          name: production-archive
          path: pepa-production-*.tar.gz
          retention-days: 7

  # -- 6. Create GitHub Release --
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, plugins, plugins-image, checksums, production-archive, plugins-packaging]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download checksums
        uses: actions/download-artifact@v5
        with:
          name: checksums
          path: release-assets/checksums/

      - name: Download production archive
        uses: actions/download-artifact@v5
        with:
          name: production-archive
          path: release-assets/production/

      - name: Download plugin archives
        uses: actions/download-artifact@v5
        with:
          pattern: plugins-archive-*
          path: release-assets/plugins/
          merge-multiple: true

      - name: Flatten release assets
        run: |
          mkdir -p release-upload/
          find release-assets/production/ -type f -name '*.tar.gz' -exec cp {} release-upload/ \; 2>/dev/null || true
          find release-assets/plugins/ -type f -name '*.tar.gz' -exec cp {} release-upload/ \; 2>/dev/null || true
          cp release-assets/checksums/sha256sums.txt release-upload/ 2>/dev/null || true
          ls -la release-upload/

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PREV_TAG: ${{ github.event.inputs.previous_tag || '' }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "# PEPA ${RELEASE_TAG}"
            echo ""
            echo "## What's Changed"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              RANGE="${PREV_TAG}..${RELEASE_TAG}"
            else
              PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
              if [ -n "${PREV_TAG}" ]; then
                RANGE="${PREV_TAG}..${RELEASE_TAG}"
              else
                RANGE="${RELEASE_TAG}"
              fi
            fi
            git log --pretty=format:"- %s (%h)" "${RANGE}" 2>/dev/null | grep -v '^Merge' | head -50 || echo "- Initial release"
            echo ""
