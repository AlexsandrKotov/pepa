            echo "  https://github.com/${REPO}/releases/download/${RELEASE_TAG}/pepa-plugins-${RELEASE_TAG#v}-linux-arm64.tar.gz"
            echo '```'
            echo ""
            echo "### 2. Extract and copy plugins"
