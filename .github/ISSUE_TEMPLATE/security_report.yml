name: Security Report
description: Report a security vulnerability (this is NOT for public bugs)
title: "[Security]: "
labels: ["security", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **IMPORTANT**: If this is a critical vulnerability, please use [GitHub Private Security Reporting](https://github.com/akotau/pepa/security/advisories/new) instead.
        
        Do not disclose details publicly until a fix is available.

  - type: textarea
    id: description
    attributes:
      label: Vulnerability Description
      description: Describe the security vulnerability.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What is the potential impact of this vulnerability?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can this vulnerability be reproduced?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (RCE, auth bypass, data breach)
        - High (privilege escalation, data exposure)
        - Medium (DoS, info disclosure)
        - Low (best practice violation)
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested Fix
      description: Do you have a suggested fix or mitigation?

  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this will be handled according to the security policy
          required: true
        - label: I agree to keep this confidential until a fix is released
          required: true
