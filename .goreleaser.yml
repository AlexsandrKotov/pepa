# GoReleaser configuration for PEPA CLI
# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pepa-cli
    main: ./cmd/cli
    binary: pepa
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildTime={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    name_template: "pepa-{{.Version}}-{{.Os}}-{{.Arch}}"
    format: tar.gz
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "sha256sums.txt"
  algorithm: sha256

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Performance
      regexp: "^perf"
    - title: Other
      regexp: ".*"

release:
  github:
    owner: your-username
    name: pepa
  draft: false
  prerelease: auto
  name_template: "PEPA {{.Version}}"

sboms:
  - artifacts: archive
