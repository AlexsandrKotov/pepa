version: "2"

run:
  timeout: 5m
  go: "1.26"

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - unused
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - encoding/json:Encoder.Encode
        - (*net/http.Response).Body.Close
        - fmt:Fprint
        - fmt:Fprintf
    gosec:
      excludes:
        - G101
    govet:
      enable:
        - assign
        - atomic
        - bools
        - nilfunc
        - printf
        - unreachable
