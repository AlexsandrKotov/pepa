{{- if .Values.apiServer.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pepa.fullname" . }}-api
  labels:
    {{- include "pepa.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.apiServer.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "pepa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
---
{{- if .Values.worker.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pepa.fullname" . }}-worker
  labels:
    {{- include "pepa.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "pepa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
---
{{- if .Values.frontend.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pepa.fullname" . }}-frontend
  labels:
    {{- include "pepa.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  minAvailable: {{ .Values.frontend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "pepa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
{{- end }}
