# ============================================================
# PEPA — Platform Engineering & Pipeline Automator
# "Delivery without pain, GitOps with joy."
# ============================================================
# This is the PRODUCTION-READY base compose file.
# It uses pre-built images (no build contexts) and works both
# as-is for production deployments and with the override file
# (docker-compose.override.yml) for local development.
#
# Usage:
#   Production:  docker compose up -d
#   Development: copy docker-compose.override.yml.example to
#                docker-compose.override.yml, then:
#                docker compose up -d
#
# All sensitive values are loaded from .env file (see .env.example).
# NEVER hardcode secrets here — they belong in .env (gitignored).
# ============================================================

name: pepa

networks:
  pepa-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  custom-plugins:  # For user-uploaded custom plugin binaries
    driver: local
  pepa-token-tmpfs:  # In-memory volume for bootstrap token (never persisted)
    driver: local
  nginx-logs:
    driver: local
  trivy-cache:  # Persistent cache for Trivy vulnerability DB (avoids re-downloading ~1GB on each restart)
    driver: local

# ── Shared environment variables (api-server + worker) ──────
# Both Go services need the same DB/Redis connection settings.
# Use YAML anchor to define once, reference with <<: *common-env.
x-common-env: &common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-pepa}
  POSTGRES_USER: ${POSTGRES_USER:-pepa}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_SSLMODE: disable
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
  AUTH_SESSION_DURATION: ${AUTH_SESSION_DURATION:-168h}
  PLUGIN_DIR: /plugins
  PLUGIN_SIGNATURE_VERIFY: ${PLUGIN_SIGNATURE_VERIFY:-true}
  PLUGIN_SIGNATURE_ENFORCE: ${PLUGIN_SIGNATURE_ENFORCE:-true}
  VAULT_ALLOW_PRIVATE_IPS: ${VAULT_ALLOW_PRIVATE_IPS:-false}
  REGISTRY_ALLOW_PRIVATE_IPS: ${REGISTRY_ALLOW_PRIVATE_IPS:-true}

services:

  # ── PostgreSQL + PGvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg18
    container_name: pepa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pepa}
      POSTGRES_USER: ${POSTGRES_USER:-pepa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Bound to loopback only — the DB must not be reachable from the
      # network. Other services connect over the internal pepa-net.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pepa} -d ${POSTGRES_DB:-pepa}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Production tuning via command override
    command: >
      postgres
        -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
        -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
        -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-384MB}
        -c work_mem=${POSTGRES_WORK_MEM:-8MB}
        -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
        -c wal_buffers=${POSTGRES_WAL_BUFFERS:-4MB}
        -c log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION:-1000}
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS_LIMIT:-2.0}'
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: pepa-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      # Bound to loopback only — Redis must not be reachable from the network.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS_LIMIT:-0.5}'
          memory: ${REDIS_MEMORY_LIMIT:-256M}

  # ── PEPA API Server ────────────────────────────────────────
  api-server:
    image: ghcr.io/alexsandrkotov/pepa/pepa-api-server:latest
    container_name: pepa-api
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"
      SERVER_ENV: ${SERVER_ENV:-production}
      CUSTOM_PLUGIN_DIR: /custom-plugins
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      IAC_BINARY: ${IAC_BINARY:-}
      # Ansible needs a writable temp directory; root filesystem is read-only.
      ANSIBLE_LOCAL_TEMP: /tmp/ansible
      # Trivy vulnerability scanner cache — mounted as named volume.
      TRIVY_CACHE_DIR: /tmp/trivy-cache
      # Pin Trivy DB to the public GHCR registry.
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
      # Java DB for JVM vulnerability detection
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
      TRIVY_SKIP_DB_UPDATE: "false"
      # VEX documents for false-positive filtering (OpenVEX/CycloneDX format)
      TRIVY_VEX_DIR: /etc/trivy/vex
      # VEX repository URI (auto-fetched VEX documents)
      TRIVY_VEX_REPOSITORY_URI: ${TRIVY_VEX_REPOSITORY_URI:-}
      # GOMEMLIMIT soft-cap keeps the Go runtime from consuming memory needed
      # by the Trivy DB download subprocess (~600 MB during Java DB fetch).
      GOMEMLIMIT: "768MiB"
      # OpenTelemetry — PEPA exports traces/logs/metrics via OTLP directly.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-pepa}
      OTEL_SAMPLING_RATE: ${OTEL_SAMPLING_RATE:-1.0}
      OTEL_INSECURE: ${OTEL_INSECURE:-true}
    ports:
      - "${API_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./plugins:/plugins:ro
      - custom-plugins:/custom-plugins
      - ${HOST_HOME_DIR:-/root}:/host-home:ro
      - ${HOST_HOME_DIR:-/root}:${HOST_HOME_DIR:-/root}:ro
      - ${MOUNT_DOCK_SOCKET:-/dev/null}:/var/run/docker.sock:ro
      - pepa-token-tmpfs:/var/run/pepa
      - trivy-cache:/tmp/trivy-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pepa-net
    # Security hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    group_add:
      - "0"  # root group — needed for Docker socket access
    tmpfs:
      - /tmp:size=2g,exec
    deploy:
      resources:
        limits:
          cpus: '${API_CPUS_LIMIT:-2.0}'
          memory: ${API_MEMORY_LIMIT:-2G}

  # ── PEPA Background Worker ─────────────────────────────────
  worker:
    image: ghcr.io/alexsandrkotov/pepa/pepa-worker:latest
    container_name: pepa-worker
    restart: unless-stopped
    environment:
      <<: *common-env
      CUSTOM_PLUGIN_DIR: /custom-plugins
      SERVER_ENV: ${SERVER_ENV:-production}
      LOG_LEVEL: info
    volumes:
      - ./plugins:/plugins:ro
      - custom-plugins:/custom-plugins
      - ${HOST_HOME_DIR:-/root}:/host-home:ro
      - ${HOST_HOME_DIR:-/root}:${HOST_HOME_DIR:-/root}:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pepa-net
    # Security hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    # Note: Worker uses distroless image (no shell), so Docker healthcheck is not possible.
    # Liveness is ensured via restart: unless-stopped policy.
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPUS_LIMIT:-1.0}'
          memory: ${WORKER_MEMORY_LIMIT:-512M}

  # ── Frontend (Next.js) ────────────────────────────────────
  frontend:
    image: ghcr.io/alexsandrkotov/pepa/pepa-frontend:latest
    container_name: pepa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api-server
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Security hardening
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    deploy:
      resources:
        limits:
          cpus: '${FRONTEND_CPUS_LIMIT:-0.5}'
          memory: ${FRONTEND_MEMORY_LIMIT:-256M}

  # ── Nginx Reverse Proxy ────────────────────────────────────
  # Provides TLS termination, rate limiting, and security headers.
  nginx:
    image: nginx:1.31-alpine
    container_name: pepa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api-server:
        condition: service_started
      frontend:
        condition: service_healthy
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Security hardening
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${NGINX_CPUS_LIMIT:-0.5}'
          memory: ${NGINX_MEMORY_LIMIT:-128M}
