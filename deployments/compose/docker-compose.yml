# ============================================================
# PEPA — Platform Engineering & Pipeline Automator
# "Delivery without pain, GitOps with joy."
# ============================================================
# Usage:
#   Development:  docker compose up -d
#   Production:   docker compose --profile production up -d
#
# All sensitive values are loaded from .env file (see .env.example).
# NEVER hardcode secrets here — they belong in .env (gitignored).
# ============================================================

name: pepa

networks:
  pepa-net:
    driver: bridge
  pepa-frontend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  custom-plugins:  # For user-uploaded custom plugin binaries
  pepa-token-tmpfs:  # In-memory volume for bootstrap token (never persisted)
  nginx-logs:
    driver: local
  loki-data:
  grafana-data:

# ── Shared environment variables (api-server + worker) ──────
# Both Go services need the same DB/Redis/S3 connection settings.
# Use YAML anchor to define once, reference with <<: *common-env.
x-common-env: &common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-pepa}
  POSTGRES_USER: ${POSTGRES_USER:-pepa}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_SSLMODE: disable
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  S3_ENDPOINT: ""  # Uncomment to enable external S3: http://minio:9000
  # S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  # S3_SECRET_KEY: ${S3_SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
  AUTH_SESSION_DURATION: ${AUTH_SESSION_DURATION:-168h}
  PLUGIN_DIR: /plugins
  VAULT_ALLOW_PRIVATE_IPS: ${VAULT_ALLOW_PRIVATE_IPS:-false}

services:

  # ── PostgreSQL + PGvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg18
    container_name: pepa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pepa}
      POSTGRES_USER: ${POSTGRES_USER:-pepa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Bound to loopback only — the DB must not be reachable from the
      # network. Other services connect over the internal pepa-net.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pepa} -d ${POSTGRES_DB:-pepa}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Production tuning via command override
    command: >
      postgres
        -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
        -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
        -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-384MB}
        -c work_mem=${POSTGRES_WORK_MEM:-8MB}
        -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
        -c wal_buffers=${POSTGRES_WAL_BUFFERS:-4MB}
        -c log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION:-1000}
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS_LIMIT:-2.0}'
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: pepa-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      # Bound to loopback only — Redis must not be reachable from the network.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS_LIMIT:-0.5}'
          memory: ${REDIS_MEMORY_LIMIT:-256M}

  # ── PEPA API Server ────────────────────────────────────────
  api-server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    image: ghcr.io/alexsandrkotov/pepa/pepa-api-server:latest
    container_name: pepa-api
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"
      SERVER_ENV: ${SERVER_ENV:-production}
      CUSTOM_PLUGIN_DIR: /custom-plugins
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:8088}
      IAC_BINARY: ${IAC_BINARY:-}
      # Ansible needs a writable temp directory; root filesystem is read-only.
      ANSIBLE_LOCAL_TEMP: /tmp/ansible
    ports:
      - "${API_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Plugins are bind-mounted from the host — not baked into the image.
      # Run `make plugins` to build them, then restart the container.
      - ../../plugins:/plugins:ro
      - custom-plugins:/custom-plugins
      # Host filesystem — allows IaC engines to access local Ansible/Terraform
      # projects by their host path (e.g. /Users/akotau/pepa/ansible).
      # The backend auto-translates host paths → /host-home/... inside the container.
      # Read-only for security. Override with HOST_HOME_DIR in .env if needed.
      - ${HOST_HOME_DIR:-${HOME}}:/host-home:ro
      # Docker compose needs the original host path so the Docker daemon can resolve
      # bind mounts in compose files (volumes, build contexts). Without this mount,
      # the daemon sees /host-home/... which doesn't exist on the host.
      - ${HOST_HOME_DIR:-${HOME}}:${HOST_HOME_DIR:-${HOME}}:ro
      # WARNING: Mounting the Docker socket gives the api container control
      # over the Docker daemon (create/delete containers, read secrets, etc.).
      # Disabled by default (mounts /dev/null). Set MOUNT_DOCK_SOCKET to the
      # socket path only if you need Docker host management features; the
      # mount stays read-only either way.
      - ${MOUNT_DOCK_SOCKET:-/dev/null}:/var/run/docker.sock:ro
      # Bootstrap token is written here (in-memory tmpfs, never touches disk).
      # Read it with: docker exec pepa-api cat /var/run/pepa/bootstrap_token.txt
      - pepa-token-tmpfs:/var/run/pepa
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pepa-net
    # Security hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    # Access to Docker socket (owned by root:root)
    group_add:
      - "0"  # root group — needed to write to /var/run/docker.sock
    tmpfs:
      - /tmp:size=256m,exec
    deploy:
      resources:
        limits:
          cpus: '${API_CPUS_LIMIT:-2.0}'
          memory: ${API_MEMORY_LIMIT:-1G}

  # ── PEPA Background Worker ─────────────────────────────────
  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.worker
    image: ghcr.io/alexsandrkotov/pepa/pepa-worker:latest
    container_name: pepa-worker
    restart: unless-stopped
    environment:
      <<: *common-env
      CUSTOM_PLUGIN_DIR: /custom-plugins
    volumes:
      # Plugins are bind-mounted from the host — not baked into the image.
      - ../../plugins:/plugins:ro
      # Writable storage for uploaded custom plugins.
      - custom-plugins:/custom-plugins
      # Host filesystem — same mount for the worker engine.
      - ${HOST_HOME_DIR:-${HOME}}:/host-home:ro
      # Original host path for Docker compose bind-mount resolution.
      - ${HOST_HOME_DIR:-${HOME}}:${HOST_HOME_DIR:-${HOME}}:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pepa-net
    # Security hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    # Note: Worker uses distroless image (no shell), so Docker healthcheck is not possible.
    # Liveness is ensured via restart: unless-stopped policy.
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPUS_LIMIT:-1.0}'
          memory: ${WORKER_MEMORY_LIMIT:-512M}

  # ── Frontend (Next.js) ────────────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployments/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    image: ghcr.io/alexsandrkotov/pepa/pepa-frontend:latest
    container_name: pepa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api-server:
        condition: service_healthy
    networks:
      - pepa-net
      - pepa-frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Security hardening
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    deploy:
      resources:
        limits:
          cpus: '${FRONTEND_CPUS_LIMIT:-0.5}'
          memory: ${FRONTEND_MEMORY_LIMIT:-256M}


  # ── Nginx Reverse Proxy (Production only) ─────────────────
  # Enabled with: docker compose --profile production up -d
  # Provides TLS termination, rate limiting, and security headers.
  nginx:
    image: nginx:1.31-alpine
    container_name: pepa-nginx
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api-server:
        condition: service_started
      frontend:
        condition: service_healthy
    networks:
      - pepa-frontend
      - pepa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Security hardening
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${NGINX_CPUS_LIMIT:-0.5}'
          memory: ${NGINX_MEMORY_LIMIT:-128M}

  # ── OpenTelemetry Collector (optional observability stack) ──
  # Enable with: docker compose --profile observability up -d
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: pepa-otel-collector
    profiles:
      - observability
    restart: unless-stopped
    command: ["--config", "/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus exporter (scrape target)
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # Health check extension
      - "55679:55679" # zpages extension
    depends_on:
      - jaeger
      - loki
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:13133/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${OTEL_CPUS_LIMIT:-0.5}'
          memory: ${OTEL_MEMORY_LIMIT:-512M}

  # ── Jaeger (distributed tracing backend) ──────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pepa-jaeger
    profiles:
      - observability
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=${JAEGER_MAX_TRACES:-5000}
    ports:
      - "16686:16686" # Jaeger UI
      - "4317"        # OTLP gRPC (internal)
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:16686"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${JAEGER_CPUS_LIMIT:-1.0}'
          memory: ${JAEGER_MEMORY_LIMIT:-512M}

  # ── Loki (log aggregation) ────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: pepa-loki
    profiles:
      - observability
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100" # Loki API
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${LOKI_CPUS_LIMIT:-1.0}'
          memory: ${LOKI_MEMORY_LIMIT:-1G}

  # ── Grafana (visualization, optional) ─────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: pepa-grafana
    profiles:
      - observability
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000" # Grafana UI (3001 to avoid conflict with frontend)
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - jaeger
    networks:
      - pepa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${GRAFANA_CPUS_LIMIT:-0.5}'
          memory: ${GRAFANA_MEMORY_LIMIT:-256M}
