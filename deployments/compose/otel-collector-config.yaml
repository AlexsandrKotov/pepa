# OpenTelemetry Collector Configuration for PEPA
# Receives traces, metrics, and logs from PEPA and exports to backends.
# Supports SigNoz, Jaeger, Loki, and Prometheus as backends.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  
  attributes:
    actions:
      - key: deployment.environment
        value: production
        action: upsert
      - key: service.namespace
        value: pepa
        action: upsert

exporters:
  # SigNoz (OTLP-native — recommended backend)
  # Set SIGNOZ_ENDPOINT env var or change the endpoint below.
  otlp/signoz:
    endpoint: ${SIGNOZ_ENDPOINT:-signoz:4317}
    tls:
      insecure: true

  # Jaeger for distributed tracing (legacy fallback)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  
  # Prometheus for metrics
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: pepa
    const_labels:
      service: pepa-api
  
  # Loki for logs
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    labels:
      attributes:
        service.name: "service"
        deployment.environment: "environment"
        service.namespace: "namespace"
  
  # Debug exporter (optional, for troubleshooting)
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  
  pipelines:
    # Distributed traces pipeline — sends to SigNoz and Jaeger
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlp/signoz, otlp/jaeger, debug]
    
    # Metrics pipeline — sends to SigNoz (via Prometheus exporter) and Prometheus
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    
    # Logs pipeline — sends to SigNoz and Loki
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlp/signoz, loki, debug]
  
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
