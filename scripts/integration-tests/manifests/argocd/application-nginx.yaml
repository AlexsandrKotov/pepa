---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-test
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: pepa
spec:
  project: default
  source:
    repoURL: http://gitea:3000/pepa-test/argocd-manifests
    targetRevision: main
    path: ./staging
  destination:
    server: https://kubernetes.default.svc
    namespace: pepa-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
