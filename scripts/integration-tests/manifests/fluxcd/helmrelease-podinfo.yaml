---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: podinfo
  namespace: pepa-test
spec:
  interval: 1m
  chart:
    spec:
      chart: podinfo
      version: "6.5.4"
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: pepa-test
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/stefanprodan/podinfo
      tag: ""
    service:
      enabled: true
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: podinfo
  namespace: pepa-test
spec:
  interval: 5m
  url: oci://ghcr.io/stefanprodan/charts
  type: oci
