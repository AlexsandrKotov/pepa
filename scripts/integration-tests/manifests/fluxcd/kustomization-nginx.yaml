---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-test
  namespace: pepa-test
spec:
  interval: 1m
  path: ./staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: nginx-test
  targetNamespace: pepa-test
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: nginx-test
  namespace: pepa-test
spec:
  interval: 1m
  url: http://gitea:3000/pepa-test/fluxcd-manifests
  ref:
    branch: main
