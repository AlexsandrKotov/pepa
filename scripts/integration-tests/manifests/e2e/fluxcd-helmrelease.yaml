apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: pepa-e2e
spec:
  interval: 1m
  chart:
    spec:
      chart: podinfo
      version: "6.7.1"
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: pepa-e2e
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/stefanprodan/podinfo
      tag: "6.7.1"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
